name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Build libDaisy
        run: make -C lib/libDaisy -j"$(nproc)"

      - name: Build DaisySP
        run: make -C lib/DaisySP -j"$(nproc)"

      - name: Build firmware
        run: make -j"$(nproc)"

      - name: Verify artifacts
        run: |
          set -e
          test -f build/MajorMIDI.bin
          arm-none-eabi-size build/MajorMIDI.elf
          # the forked libDaisy must be what we linked against
          strings build/MajorMIDI.bin | grep -q "Major MIDI" \
            || { echo "::error::USB descriptor missing - wrong libDaisy?"; exit 1; }

      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp build/MajorMIDI.bin dist/
          cp lib/libDaisy/core/dsy_bootloader_v6_2-intdfu-2000ms.bin dist/
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          # on pull_request, github.sha is the merge commit -- use the branch
          # head so the artifact name matches a local `git rev-parse HEAD`
          name: MajorMIDI-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/MajorMIDI.bin

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Installing

            **New module?** Flash `dsy_bootloader_v6_2-intdfu-2000ms.bin` to internal
            flash first — a stock Patch SM has no Daisy bootloader, and without it the
            app flash appears to succeed but the module stays dark. This is a one-time
            step; see the README for the full procedure.

            **Updating?** Tap RESET to open the 2-second DFU window, then flash
            `MajorMIDI.bin` with either the
            [Web Programmer](https://electro-smith.github.io/Programmer/) (QSPI target,
            no install needed) or:

            ```sh
            dfu-util -a 0 -s 0x90040000:leave -D MajorMIDI.bin -d ,0483:df11
            ```

            Verify downloads against `SHA256SUMS.txt`.
